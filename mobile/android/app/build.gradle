plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = file('key.properties')
}
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveStoreFile(String storeFilePath) {
    if (!storeFilePath) return null
    def f = file(storeFilePath)
    if (f.exists()) return f
    f = rootProject.file(storeFilePath)
    if (f.exists()) return f
    // Also check relative to mobile/android/app if defined from root
    f = file("app/" + storeFilePath)
    if (f.exists()) return f
    return file(storeFilePath)
}

android {
    namespace = "com.moneyflow.app"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.moneyflow.app"
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists() && keystoreProperties['storeFile']) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = resolveStoreFile(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            def isCI = System.getenv("CI") == "true" || System.getenv("GITHUB_ACTIONS") == "true"
            def hasKeyProps = keystorePropertiesFile.exists() &&
                              keystoreProperties['storeFile'] &&
                              keystoreProperties['keyAlias'] &&
                              keystoreProperties['storePassword'] &&
                              keystoreProperties['keyPassword']

            if (hasKeyProps) {
                def sf = resolveStoreFile(keystoreProperties['storeFile'])
                if (!sf.exists()) {
                    if (isCI) {
                        throw new GradleException("Release keystore file specified in key.properties was not found at: ${keystoreProperties['storeFile']}")
                    } else {
                        logger.warn("WARNING: Keystore file '${keystoreProperties['storeFile']}' not found. Falling back to debug signing for local build.")
                        signingConfig = signingConfigs.debug
                    }
                } else {
                    signingConfig = signingConfigs.release
                }
            } else {
                if (isCI) {
                    throw new GradleException("Release build in CI requires release signing configuration! Missing key.properties or missing required keys (storeFile, storePassword, keyAlias, keyPassword).")
                } else {
                    logger.warn("WARNING: key.properties not found or incomplete. Falling back to debug signing for local non-CI build.")
                    signingConfig = signingConfigs.debug
                }
            }
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
