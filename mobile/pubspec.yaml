name: money_flow
description: Money Flow - Aplikasi Manajemen Keuangan Pribadi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Formatting
  intl: ^0.19.0

  # Charts
  fl_chart: ^0.69.0

  # UUID
  uuid: ^4.4.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  cryptography: ^2.9.0
  local_auth: ^2.3.0
  pdf: ^3.11.3
  csv: ^6.0.0
  share_plus: ^10.1.4
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/backup/
