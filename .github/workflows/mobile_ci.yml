name: Money Flow Mobile CI / CD & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK directly to GitHub Releases'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Test, Analyze, and Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Code (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Configure Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::CRITICAL ERROR: Release signing secrets are missing or incomplete!"
            echo "::error::Please configure the following GitHub Repository Secrets:"
            echo "::error::  - KEYSTORE_BASE64"
            echo "::error::  - KEYSTORE_PASSWORD"
            echo "::error::  - KEY_ALIAS"
            echo "::error::  - KEY_PASSWORD"
            echo "::error::See docs/SIGNING.md for complete instructions."
            exit 1
          fi

          echo "Decoding release keystore to android/app/monflow.jks..."
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/monflow.jks
          cp android/app/monflow.jks android/monflow.jks

          echo "Generating android/key.properties..."
          cat <<EOF > android/key.properties
storeFile=monflow.jks
storePassword=${KEYSTORE_PASSWORD}
keyAlias=${KEY_ALIAS}
keyPassword=${KEY_PASSWORD}
EOF

          chmod 600 android/app/monflow.jks android/monflow.jks android/key.properties
          echo "Release signing configured successfully."

      - name: Build Universal Release APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }}
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/MoneyFlow-universal-release.apk

      - name: Build Split-per-ABI APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }}
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../dist/MoneyFlow-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../dist/MoneyFlow-armeabi-v7a-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk ../dist/MoneyFlow-x86_64-release.apk

      - name: Verify APK Signature & Certificate
        run: |
          echo "Locating apksigner..."
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="apksigner"
          fi
          echo "Using apksigner: $APKSIGNER"

          APK_PATH="../dist/MoneyFlow-universal-release.apk"
          echo "Verifying $APK_PATH..."

          CERT_INFO=$("$APKSIGNER" verify --print-certs "$APK_PATH")
          echo "Certificate Details:"
          echo "$CERT_INFO"

          # Extract and print SHA-256 certificate fingerprint
          SHA256_FINGERPRINT=$(echo "$CERT_INFO" | grep -i "SHA-256 digest" || true)
          echo "=========================================="
          echo "Verified Certificate Fingerprint: $SHA256_FINGERPRINT"
          echo "=========================================="

          # Verify that it is NOT a debug certificate
          if echo "$CERT_INFO" | grep -iq "Android Debug"; then
            echo "::error::SECURITY CHECK FAILED: Release APK is signed with an Android Debug key! This will cause package conflict errors on user devices."
            exit 1
          fi

          if [ -z "$SHA256_FINGERPRINT" ]; then
            echo "::error::SECURITY CHECK FAILED: No valid SHA-256 certificate digest found!"
            exit 1
          fi

          echo "Signature verification PASSED: APK is signed with a valid non-debug release key."

      - name: Upload Build Artifacts (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: money-flow-apks
          path: dist/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || format('v1.0.{0}', github.run_number) }}
          name: Money Flow Release ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || format('v1.0.{0}', github.run_number) }}
          files: dist/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true


